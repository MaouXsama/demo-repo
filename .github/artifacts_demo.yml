name: Build and Store Artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # الخطوة 1: سحب الكود الجديد
    - name: Check Out Code
      uses: actions/checkout@v4

    # الخطوة 2: إعداد بيئة بايثون
    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # الخطوة 3: تثبيت الاعتماديات مع أداة wheel للبناء
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install wheel

    # الخطوة 4: بناء المشروع واستخراج ملف الـ .whl
    - name: Run Build
      run: |
        python setup.py bdist_wheel

    # الخطوة 5: طباعة تصحيحية (Debug) لاستعراض الملفات الناتجة والتأكد من مسارها
    - name: Debug Build Output
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing all files after build:"
        ls -R

    # الخطوة 6: رفع المخرجات (مجلد dist) كـ Artifact إلى GitHub
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: dist/
